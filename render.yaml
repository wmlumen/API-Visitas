services:
  - type: web
    name: api-visitas
    runtime: node
    repo: https://github.com/wmlumen/API-Visitas
    plan: free
    region: ohio
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 3000
      - key: DB_PATH
        value: ./db/visits.json
